name: CI

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: init.sh (install, lint, link check, offline tests)
        run: ./init.sh
      - name: Generated files are up to date
        run: .venv/bin/cpu-rag-lab report --check
      - name: Tiny grid
        run: .venv/bin/cpu-rag-lab run --config configs/tiny.json --results /tmp/tiny.jsonl
