[project]
name = "cpu-rag-lab"
version = "0.1.0rc1"
description = "Measure which retrieval settings work best on small CPU-only hardware, with confidence intervals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shreyas" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dense = ["fastembed>=0.9,<0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cpu-rag-lab = "cpu_rag_lab.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cpu_rag_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format sets the line length; long strings stay readable

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
